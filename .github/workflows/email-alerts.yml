name: Alertes e-mail Leboncoin
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_email_alerts.py
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
      - name: Commit des données
        run: |
          git config user.name "flipradar-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data/listings.json
          git diff --cached --quiet || (git commit -m "Mise à jour des annonces (alertes e-mail)" && git push)
